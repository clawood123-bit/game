// ----- 5. 게임 상태 -----
let S = null;                   // 저장되는 정보 (장, 깃발, 단서, 위치)
let scene = "title";            // title(시작화면), game(게임 중), end(엔딩)
let titleIdx = 0;
const P = { x: 8, y: 6, dir: "right", moving: false, fx: 0, fy: 0, prog: 0, foot: false };
let busy = false;               // 이벤트(대화) 중이면 true
let MSG = null, CHOICE = null, NOTE = null, CARD = null, CUT = null;
let fadeAlpha = 0, fadeTarget = 0, fadeDone = null;
let frame = 0;

function newState() {
  return { ch: 1, f: {}, clues: [], map: "deck", x: 8, y: 6, dir: "right" };
}
const has = id => S.clues.includes(id);


// ----- 6. 저장 / 불러오기 -----
function save() {
  if (scene !== "game") return;
  S.map = S.map; S.x = P.x; S.y = P.y; S.dir = P.dir;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function loadSave() {
  try { const t = localStorage.getItem(SAVE_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; }
}
function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}


// ----- 7. 키보드 -----
const held = {};
let pressed = new Set();
const KEYMAP = {
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  Space: "ok", Enter: "ok", KeyZ: "ok", KeyX: "cancel", Escape: "cancel", KeyC: "note"
};
addEventListener("keydown", e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  if (!e.repeat) pressed.add(k);
  held[k] = true;
});
addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) held[k] = false; });
function hit(k) { if (pressed.has(k)) { pressed.delete(k); return true; } return false; }


// ----- 8. 이벤트 도우미 (대화, 선택지, 화면 전환) -----
const sleep = ms => new Promise(r => setTimeout(r, ms));

// 대화창 띄우기 : 키를 누를 때까지 기다려요
function say(name, text) {
  return new Promise(resolve => { MSG = { name, text, shown: 0, resolve }; });
}
const T = (id, text) => say(NAMES[id], text);   // 등장인물이 말하기
const narr = text => say(null, text);            // 설명 글

// 선택지 : 고른 번호를 알려줘요
function choose(question, options) {
  return new Promise(resolve => { CHOICE = { question, options, idx: 0, resolve }; });
}

// 단서 수첩 열기 (present = true 면 증거를 골라서 제시)
function openNote(present) {
  return new Promise(resolve => { NOTE = { present, idx: 0, resolve }; });
}

function fadeTo(target) {
  if (fadeAlpha === target) { fadeTarget = target; return Promise.resolve(); }   // 이미 그 밝기면 바로 끝
  return new Promise(resolve => { fadeTarget = target; fadeDone = resolve; });
}

async function chapterCard(title, sub) {
  await fadeTo(1);
  CARD = { title, sub };
  await sleep(2200);
  CARD = null;
}

async function addClue(id) {
  if (has(id)) return;
  S.clues.push(id);
  await narr("📒 단서 획득! [" + CLUES[id].name + "]  (C 키로 수첩에서 볼 수 있어요)");
}

// 다른 지도로 이동
async function changeMap(id, x, y, dir) {
  await fadeTo(1);
  S.map = id; P.x = x; P.y = y; P.dir = dir; P.moving = false;
  await fadeTo(0);
  save();
  await onEnter(id);
}

// 이벤트 실행 (실행 중엔 플레이어가 못 움직여요)
function runEvent(fn) {
  if (busy) return;
  busy = true;
  fn().catch(err => console.error(err)).finally(() => { busy = false; save(); });
}

// NPC 걷기 (컷신용)
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function walkNpc(n, dir, steps) {
  return new Promise(resolve => { n.walk = { dir, steps, prog: 0, resolve }; n.dir = dir; });
}


// ----- 9. 지도 정보 읽기 -----
const MAPOF = () => MAPS[S.map];
function tileAt(x, y) {
  const m = MAPOF();
  if (y < 0 || y >= ROWS || x < 0 || x >= COLS) return " ";
  return m.rows[y][x];
}
function npcAt(x, y) { return npcs().find(n => n.x === x && n.y === y && !n.gone); }


// ----- 10. 장소마다 있는 사람들 -----
function N(id, x, y, dir) { return { id, x, y, dir }; }

function npcs() {
  if (CUT) return CUT;
  const ch = S.ch, f = S.f, L = [];
  switch (S.map) {
    case "deck":
      if (ch === 1) L.push(N("jia", 10, 5, "down"));
      if (ch === 2 || ch === 3) L.push(N("doctor", 5, 7, "left"));
      break;
    case "hall":
      if (ch === 2 || ch === 3) L.push(N("jia", 10, 7, "down"));
      break;
    case "dining":
      if (ch === 1 && f.dinner && !f.dinnerDone) {
        L.push(N("ceo", 5, 3, "down"), N("doctor", 4, 3, "down"), N("haeun", 3, 5, "up"),
               N("lena", 12, 3, "down"), N("junho", 13, 5, "up"));
      }
      if (ch >= 2) L.push(N("haeun", 12, 3, "down"));
      L.push(N("minho", 17, 5, "down"));
      break;
    case "lounge":
      if (ch === 2) L.push(N("junho", 15, 4, "up"));
      if (ch >= 2 || f.dinnerDone) L.push(N("lena", 5, 4, "down"));
      break;
    case "infirmary": L.push(N("nurse", 9, 5, "down")); break;
    case "bridge":    L.push(N("captain", 10, 5, "down")); break;
    case "cabinJ":    if (ch === 3) L.push(N("junho", 9, 5, "down")); break;
  }
  return L;
}


// ----- 11. 장소에 들어갈 때 일어나는 일 -----
async function onEnter(id) {
  const ch = S.ch, f = S.f;
  if (id === "deck" && ch === 1 && !f.intro) await introScene();
  if (id === "dining" && ch === 1 && !f.dinner) await dinnerScene();
  if (id === "hall" && ch === 1 && f.dinnerDone && !f.argue) await argueScene();
  if (id === "suite" && ch === 2 && !f.crime) await crimeScene();
  if (id === "bridge" && ch === 2 && f.ch2done) await chapter3Scene();
}

        const c = await choose("간호사에게 무엇을 할까?", ["갈색 약병을 보여준다", "그냥 이야기한다"]);
        if (c === 0) {
          await T("nurse", "현장에 있던 약병이요? 검사 키트로 알약 하나를 확인해 볼게요.");
          await narr("……");
          await T("nurse", "이, 이건...! 독성 약품 반응이 나왔어요!");
          await addClue("poison");
          await T("nurse", "잠깐만요... 그러고 보니!");
          await T("nurse", "어제 저녁 6시 반쯤 최민우 박사님이 두통약을 받으러 오셨어요. 제가 5분쯤 자리를 비웠었고요.");
          await T("nurse", "그리고 8시에 보관함을 정리하는데, 독성 약품 한 병이 텅 비어 있었어요. 제가 실수로 쏟은 줄 알았는데...");
          await addClue("infirmary");
        } else {
          await T("nurse", "무서운 일이에요. 탐정님도 조심하세요.");
        }
      } else {
        await T("nurse", "그 약품은 원래 배를 소독할 때 쓰는 거예요. 아주 위험한 거라 잠가 두는데...");
      }
      break;

    case "captain":
      if (ch === 1) {
        await T("captain", "오로라호 선장 강도현이오. 즐거운 여행 되시오.");
        await T("captain", "다만 이번 항해는 날씨가 걱정이군. 내일부터 폭풍이 온다던데.");
      } else if (ch === 2) {
        if (!has("cardlog")) {
          await T("captain", "스위트룸 문은 카드키로만 열 수 있소. 출입 기록을 뽑아 왔으니 참고하시오.");
          await addClue("cardlog");
          await afterCh2Step();
        } else {
          await T("captain", "폭풍 때문에 항구까지 하루는 더 걸리오. 부탁하오, 단비 학생.");
        }
      } else if (["poison", "infirmary", "lena", "speech", "article"].every(has)) {
        const c = await choose("이제 진실을 밝힐 준비가 됐을까?", ["모두를 라운지로 모아 주세요", "조금만 더 조사할게요"]);
        if (c === 0) await showdown();
        else await T("captain", "알겠소. 준비되면 말해 주시오.");
      } else if (has("poison") && has("lena") && has("infirmary") && !f.masterKey) {
        await T("danbi", "선장님, 최민우 박사의 방을 조사하게 해 주세요.");
        await T("captain", "최 박사를? ...독이 든 약, 의무실 기록, 레나 씨의 증언까지라.");
        await T("captain", "...알겠소. 여기 마스터키요. 이걸로 최 박사의 방을 열 수 있소.");
        f.masterKey = true;
        await narr("🔑 마스터키를 받았다!");
      } else {
        await T("captain", "진실은 찾았소? 필요한 게 있으면 말하시오.");
      }
      break;
  }
}

async function bedEvent() {

    await narr("푹신한 침대다. 아직 잘 시간은 아니다.");
  } else {
    await narr("푹신한 침대다. 지금은 잠잘 때가 아니다!");
  }
}

}

//  15. 지금 해야 할 일 (화면 왼쪽 위에 표시)
// =====================================================
function objectiveList() {
  const ch = S.ch, f = S.f;
  if (ch === 1) {
    if (!f.intro) return [];
    if (!f.dinner) return ["식당(복도 아래쪽 왼쪽 문)의 환영 만찬에 가자"];
    if (!f.dinnerDone) return ["만찬에 온 사람들과 이야기하기 (" + dinnerCount() + "/5)"];
    if (!f.argue) return ["식당을 나가 복도로 가자"];
    return ["내 방(복도 위 첫 번째 문) 침대에서 잠을 자자"];
  }
  if (ch === 2) {
    if (!f.crime) return ["비명이 들린 스위트룸(복도 위 네 번째 문)으로 가자"];
    if (f.ch2done) return ["함교(복도 오른쪽 끝)로 가서 선장을 만나자"];
    const room = ["pillbottle", "teacup", "cufflink", "emptybottle"].filter(has).length;
    if (room < 4) return ["스위트룸을 조사하자 (" + room + "/4)"];
    const L = [];
    if (!has("cardlog")) L.push("함교의 선장에게 이야기 듣기");
    if (!has("roomservice")) L.push("식당의 웨이터 민호에게 이야기 듣기");
    if (!has("junho")) L.push("라운지의 준호에게 이야기 듣기");
    if (!f.t2_haeun) L.push("식당의 하은에게 이야기 듣기");
    if (!f.t2_doctor) L.push("갑판의 최 박사에게 이야기 듣기");
    return L;
  }
  if (ch === 3) {
    const L = [];
    if (!has("poison")) L.push("의무실 간호사에게 갈색 약병 보여주기");
    if (!has("lena")) L.push("라운지의 레나에게 만찬 이야기 듣기");
    if (!has("speech")) L.push("식당의 하은에게 카드키 기록 보여주기");
    if (has("poison") && has("lena") && !f.masterKey) L.push("함교의 선장에게 최 박사 방 열쇠 부탁하기");
    if (f.masterKey && !has("article")) L.push("최 박사의 방(복도 위 세 번째 문) 조사하기");
    if (!L.length) L.push("함교의 선장에게 모두를 모아 달라고 하자!");
    return L;
  }
  return [];
}

// =====================================================
//  17. 매 순간 움직이기 (업데이트)
// =====================================================
function update() {
  frame++;

  // 화면 어두워지기/밝아지기
  if (fadeAlpha !== fadeTarget) {
    fadeAlpha += Math.sign(fadeTarget - fadeAlpha) * 0.06;
    if (Math.abs(fadeAlpha - fadeTarget) < 0.06) {
      fadeAlpha = fadeTarget;
      if (fadeDone) { const d = fadeDone; fadeDone = null; d(); }
    }
  }

  // NPC 걷기 (컷신)
  for (const n of (CUT || [])) {
    if (!n.walk) continue;
    n.walk.prog += 0.125;
    if (n.walk.prog >= 1) {
      const [dx, dy] = DIRS[n.walk.dir];
      n.x += dx; n.y += dy; n.walk.prog = 0; n.walk.steps--;
      if (n.walk.steps <= 0) { const r = n.walk.resolve; n.walk = null; r(); }
    }
  }

  if (scene === "title") return updateTitle();
  if (scene === "end") { if (hit("ok")) { scene = "title"; titleIdx = 0; } return; }

  // 대화창
  if (MSG) {
    MSG.shown = Math.min(MSG.text.length, MSG.shown + 1.5);
    if (hit("ok")) {
      if (MSG.shown < MSG.text.length) MSG.shown = MSG.text.length;
      else { const r = MSG.resolve; MSG = null; r(); }
    }
    return;
  }
  // 선택지
  if (CHOICE) {
    if (hit("up")) CHOICE.idx = (CHOICE.idx + CHOICE.options.length - 1) % CHOICE.options.length;
    if (hit("down")) CHOICE.idx = (CHOICE.idx + 1) % CHOICE.options.length;
    if (hit("ok")) { const r = CHOICE.resolve, i = CHOICE.idx; CHOICE = null; r(i); }
    return;
  }
  // 단서 수첩
  if (NOTE) {
    const n = S.clues.length;
    if (n && hit("up")) NOTE.idx = (NOTE.idx + n - 1) % n;
    if (n && hit("down")) NOTE.idx = (NOTE.idx + 1) % n;
    if (hit("cancel") || (!NOTE.present && hit("note"))) { const r = NOTE.resolve; NOTE = null; r(null); return; }
    if (hit("ok")) {
      const r = NOTE.resolve, present = NOTE.present, id = S.clues[NOTE.idx];
      if (present && id) { NOTE = null; r(id); }
      else if (!present) { NOTE = null; r(null); }
    }
    return;
  }

  if (busy || fadeAlpha > 0) return;

  // 플레이어 걷기
  if (P.moving) {
    P.prog += 0.125;                       // 8번에 한 칸
    if (P.prog >= 1) {
      P.moving = false; P.prog = 0;
      if (tileAt(P.x, P.y) === "D") {
        const d = MAPOF().doors[P.x + "," + P.y];
        if (d) runEvent(() => changeMap(d.to, d.x, d.y, d.dir));
        return;
      }
    }
  }
  if (!P.moving) {
    if (hit("note")) { runEvent(() => openNote(false)); return; }
    if (hit("ok")) { interact(); return; }
    for (const d of ["up", "down", "left", "right"]) {
      if (!held[d]) continue;
      P.dir = d;
      const [dx, dy] = DIRS[d];
      const tx = P.x + dx, ty = P.y + dy;
      const t = tileAt(tx, ty);
      if (t === "D") {
        const door = MAPOF().doors[tx + "," + ty];
        if (door && door.locked && door.locked()) {
          runEvent(() => narr(door.lockMsg));
          break;
        }
      }
      if (!SOLID.includes(t) && !npcAt(tx, ty)) {
        P.fx = P.x; P.fy = P.y; P.x = tx; P.y = ty;
        P.moving = true; P.prog = 0; P.foot = !P.foot;
      }
      break;
    }
  }
}

// 스페이스바 : 앞에 있는 사람에게 말 걸기 / 물건 조사
function interact() {
  const [dx, dy] = DIRS[P.dir];
  let tx = P.x + dx, ty = P.y + dy;
  let n = npcAt(tx, ty);
  if (!n && tileAt(tx, ty) === "K") n = npcAt(tx + dx, ty + dy);   // 카운터 너머 사람
  if (n) {
    n.dir = { up: "down", down: "up", left: "right", right: "left" }[P.dir];
    runEvent(() => talk(n));
    return;
  }
  const s = spots().find(s => s.x === tx && s.y === ty);
  if (s) runEvent(s.run);
}

function updateTitle() {
  const opts = titleOptions();
  if (hit("up") || hit("down")) titleIdx = (titleIdx + 1) % opts.length;
  if (hit("ok")) {
    const o = opts[titleIdx];
    scene = "game";
    if (o === "처음부터") {
      clearSave();
      S = newState();
      P.x = 8; P.y = 6; P.dir = "right";
      runEvent(async () => {
        await chapterCard("제1장", "출항");
        await fadeTo(0);
        await onEnter("deck");
      });
    } else {
      S = loadSave();
      P.x = S.x; P.y = S.y; P.dir = S.dir;
      S.inShowdown = false;
      fadeAlpha = 1;
      runEvent(() => fadeTo(0));
    }
  }
}
function titleOptions() { return loadSave() ? ["이어하기", "처음부터"] : ["처음부터"]; }

    case ",": R(S && S.map === "suite" ? "#3e4f7a" : "#7e2433", px, py, 32, 32);

              ctx.fillStyle = "#3f8f4a"; ctx.beginPath(); ctx.arc(px + 16, py + 12, 9, 0, 7); ctx.fill();

    case "p": R("#111", px + 1, py + 2, 30, 26); R("#fff", px + 3, py + 20, 26, 6);
              for (let i = 0; i < 6; i++) R("#111", px + 6 + i * 4, py + 20, 2, 4); break;
    case "o": ctx.strokeStyle = "#f06a2a"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(px + 16, py + 16, 10, 0, 7); ctx.stroke();
              R("#fff", px + 14, py + 3, 4, 6); R("#fff", px + 14, py + 23, 4, 6); R("#fff", px + 3, py + 14, 6, 4); R("#fff", px + 23, py + 14, 6, 4); break;
    case "g": R("#8a5a2b", px + 6, py + 10, 20, 18); R("#6b4320", px + 6, py + 16, 20, 2); R("#3a2414", px + 12, py + 6, 8, 4); break;
    case "n": R("#6b4a2f", px + 4, py + 8, 24, 22); R("#4e331f", px + 6, py + 18, 20, 2);
              if (S.map === "suite") { R("#7a4a1c", px + 12, py + 2, 8, 10); R("#d9d9d9", px + 12, py + 1, 8, 3); } break;
  }
}

function drawPerson(px, py, dir, step, look) {
  let rows = dir === "up" ? BODY_UP.slice() : dir === "down" ? BODY_DOWN.slice() : BODY_LEFT.slice();
  if (step) {
    if (dir === "up" || dir === "down") {
      if (step === 1) { rows[14] = "..PPP..BBB.."; rows[15] = "..BBB......."; }
      else { rows[14] = "..BBB..PPP.."; rows[15] = ".......BBB.."; }
    } else { rows[14] = "..PP....PP.."; rows[15] = "..BB....BB.."; }
  }
  if (look.long && dir !== "up") {
    rows = rows.map((r, i) => (i >= 3 && i <= 8) ? (dir === "down" ? "." + "H" + r.slice(2, 10) + "H" + "." : r.slice(0, 9) + "HH" + ".") : r);
  }
  if (look.hat) { rows[0] = "...AAAAAA..."; rows[1] = "..AAAAAAAA.."; rows[2] = ".AAAAAAAAAA."; }
  if (look.glasses && dir === "down") rows[4] = "..SGGSSGGS..";
  if (look.glasses && dir === "left") rows[4] = "..GGSSSSHH..";
  const col = { H: look.hair, S: look.skin, E: "#2a1f1f", C: look.shirt, P: look.pants, B: look.shoes, A: look.hat, G: "#9fd3f0" };
  const flip = dir === "right";
  ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.ellipse(px + 16, py + 30, 9, 3, 0, 0, 7); ctx.fill();
  for (let r = 0; r < 16; r++) for (let c = 0; c < 12; c++) {
    const k = rows[r][c];
    if (k === ".") continue;
    R(col[k], px + 4 + (flip ? 11 - c : c) * 2, py + r * 2 - 2, 2, 2);
  }
}

// 글자를 상자 너비에 맞게 여러 줄로 나누기
function wrap(text, maxW) {
  const out = [];
  for (const para of text.split("\n")) {
    let line = "";
    for (const ch of para) {
      if (ctx.measureText(line + ch).width > maxW) { out.push(line); line = ch; } else line += ch;
    }
    out.push(line);
  }
  return out;
}

function box(x, y, w, h) {
  R("rgba(12,16,34,0.92)", x, y, w, h);
  ctx.strokeStyle = "#e8d9a8"; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}

function drawMessage(name, text, shown) {
  box(10, 304, 620, 104);
  if (name) {
    ctx.font = "bold 15px " + FONT;
    const w = ctx.measureText(name).width + 24;
    box(14, 280, w, 28);
    ctx.fillStyle = "#ffd76b"; ctx.fillText(name, 26, 299);
  }
  ctx.font = "17px " + FONT; ctx.fillStyle = "#fff";
  const lines = wrap(text.slice(0, Math.floor(shown)), 590);
  lines.slice(0, 4).forEach((l, i) => ctx.fillText(l, 26, 334 + i * 23));
  if (shown >= text.length && frame % 40 < 25) { ctx.fillStyle = "#ffd76b"; ctx.fillText("▼", 606, 398); }
}

function drawNote() {
  box(40, 30, 560, 356);
  ctx.font = "bold 18px " + FONT; ctx.fillStyle = "#ffd76b";
  ctx.fillText("📒 단서 수첩  (" + S.clues.length + "/13)", 60, 62);
  ctx.font = "13px " + FONT; ctx.fillStyle = "#c9c9c9";
  ctx.fillText(NOTE.present ? "제시할 증거를 고르세요 · Space 제시 · X 취소" : "↑↓ 고르기 · X 또는 C 닫기", 60, 84);
  if (!S.clues.length) { ctx.font = "16px " + FONT; ctx.fillStyle = "#fff"; ctx.fillText("아직 모은 단서가 없다.", 60, 130); return; }
  const start = Math.max(0, Math.min(NOTE.idx - 5, S.clues.length - 11));
  ctx.font = "15px " + FONT;
  S.clues.slice(start, start + 11).forEach((id, i) => {
    const sel = start + i === NOTE.idx;
    if (sel) R("rgba(255,215,107,0.25)", 52, 98 + i * 25, 200, 24);
    ctx.fillStyle = sel ? "#ffd76b" : "#fff";
    ctx.fillText((sel ? "▶ " : "   ") + CLUES[id].name, 58, 116 + i * 25);
  });
  R("rgba(255,255,255,0.2)", 262, 100, 2, 270);
  const c = CLUES[S.clues[NOTE.idx]];
  ctx.font = "bold 17px " + FONT; ctx.fillStyle = "#ffd76b"; ctx.fillText(c.name, 280, 120);
  ctx.font = "15px " + FONT; ctx.fillStyle = "#fff";
  wrap(c.desc, 300).forEach((l, i) => ctx.fillText(l, 280, 150 + i * 23));
}

function drawTitle() {
  R("#0e1d3a", 0, 0, 640, 416);
  for (let i = 0; i < 40; i++) R("rgba(255,255,255,0.6)", (i * 97) % 640, (i * 53) % 200, 2, 2);
  for (let x = 0; x < 20; x++) for (let y = 9; y < 13; y++) {
    R("#1d3c66", x * 32, y * 32, 32, 32);
    const o = (frame / 4 + x * 7 + y * 13) % 32;
    R("rgba(255,255,255,0.2)", x * 32 + o % 24, y * 32 + 10, 8, 2);
  }
  // 배 실루엣
  R("#f2f2f2", 150, 250, 340, 40); R("#c0392b", 150, 285, 340, 8);
  R("#e6e6e6", 200, 222, 230, 28); R("#d9d9d9", 250, 198, 130, 24); R("#2c3e50", 300, 170, 20, 28);
  for (let i = 0; i < 9; i++) R(frame % 80 < 40 && i % 3 === 0 ? "#ffe46b" : "#9fd3f0", 210 + i * 24, 230, 10, 8);
  ctx.textAlign = "center";
  ctx.font = "bold 40px " + FONT; ctx.fillStyle = "#ffd76b"; ctx.fillText("크루즈 살인사건", 320, 90);
  ctx.font = "18px " + FONT; ctx.fillStyle = "#c9d6ee"; ctx.fillText("— 오로라호의 밤 —", 320, 124);
  titleOptions().forEach((o, i) => {
    ctx.font = (i === titleIdx ? "bold " : "") + "20px " + FONT;
    ctx.fillStyle = i === titleIdx ? "#ffd76b" : "#ffffff";
    ctx.fillText((i === titleIdx ? "▶ " : "") + o, 320, 352 + i * 30);
  });
  ctx.font = "13px " + FONT; ctx.fillStyle = "#8fa3c7";
  ctx.fillText("방향키 이동 · Space 결정/조사 · C 단서 수첩", 320, 408);
  ctx.textAlign = "left";
}

function draw() {
  if (scene === "title") { drawTitle(); drawFade(); return; }
  if (scene === "end") {
    R("#000", 0, 0, 640, 416); ctx.textAlign = "center";
    ctx.font = "bold 34px " + FONT; ctx.fillStyle = "#ffd76b"; ctx.fillText("THE END", 320, 170);
    ctx.font = "18px " + FONT; ctx.fillStyle = "#fff";
    ctx.fillText("크루즈 살인사건을 해결했어요! 🎉", 320, 215);
    ctx.fillText("모은 단서 " + S.clues.length + " / 13", 320, 250);
    ctx.font = "15px " + FONT; ctx.fillStyle = "#aaa"; ctx.fillText("Space 를 누르면 처음 화면으로", 320, 320);
    ctx.textAlign = "left"; return;
  }
  const m = MAPOF();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) drawTile(m.rows[y][x], x, y);

  // 반짝이는 단서
  if (!busy) for (const s of spots()) {
    if (s.clue && !has(s.clue) && (frame + s.x * 9) % 50 < 30) {
      R("#fff7c2", s.x * 32 + 14, s.y * 32 + 6, 4, 4); R("#fff7c2", s.x * 32 + 12, s.y * 32 + 8, 8, 1); R("#fff7c2", s.x * 32 + 15, s.y * 32 + 3, 1, 10);
    }
  }

  // 이름표 (복도)
  if (m.labels) {
    ctx.font = "bold 12px " + FONT; ctx.textAlign = "center";
    for (const l of m.labels) {
      const w = ctx.measureText(l.t).width + 10;
      const cx = Math.max(w / 2 + 2, Math.min(638 - w / 2, l.x * 32 + 16));
      R("rgba(0,0,0,0.65)", cx - w / 2, l.y * 32 + 8, w, 17);
      ctx.fillStyle = "#ffe9a8"; ctx.fillText(l.t, cx, l.y * 32 + 21);
    }
    ctx.textAlign = "left";
  }

  // 사람들 (위쪽에 있는 사람부터 그려요)
  const people = npcs().filter(n => !n.gone).map(n => {
    let x = n.x, y = n.y, step = 0;
    if (n.walk) { const [dx, dy] = DIRS[n.walk.dir]; x += dx * n.walk.prog; y += dy * n.walk.prog; step = n.walk.prog < 0.5 ? (n.walk.steps % 2 ? 1 : 3) : 0; }
    return { x, y, dir: n.dir, step, look: LOOKS[n.id] };
  });
  let px = P.x, py = P.y, pstep = 0;
  if (P.moving) { px = P.fx + (P.x - P.fx) * P.prog; py = P.fy + (P.y - P.fy) * P.prog; pstep = P.prog < 0.5 ? (P.foot ? 1 : 3) : 0; }
  people.push({ x: px, y: py, dir: P.dir, step: pstep, look: LOOKS.danbi });
  people.sort((a, b) => a.y - b.y).forEach(p => drawPerson(p.x * 32, p.y * 32, p.dir, p.step, p.look));

  // 날씨와 시간
  if (S.map === "deck") {
    if (S.f.dawn) R("rgba(255,150,170,0.18)", 0, 0, 640, 416);
    else if (S.ch === 1) R("rgba(255,140,60,0.15)", 0, 0, 640, 416);
    else {
      R("rgba(10,20,50,0.35)", 0, 0, 640, 416);
      ctx.strokeStyle = "rgba(200,220,255,0.5)"; ctx.lineWidth = 1; ctx.beginPath();
      for (let i = 0; i < 70; i++) { const rx = (i * 83 + frame * 3) % 660 - 10, ry = (i * 47 + frame * 9) % 430; ctx.moveTo(rx, ry); ctx.lineTo(rx - 4, ry + 12); }
      ctx.stroke();
    }
  } else if (S.ch === 1 && S.f.dinnerDone) R("rgba(10,10,40,0.18)", 0, 0, 640, 416);

  // 장소 이름 + 할 일
  ctx.font = "bold 14px " + FONT;
  const place = m.name + (S.ch <= 3 ? "  ·  " + ["", "제1장 출항", "제2장 죽음의 스위트룸", "제3장 숨겨진 진실"][S.ch] : "");
  R("rgba(0,0,0,0.6)", 6, 6, ctx.measureText(place).width + 16, 22);
  ctx.fillStyle = "#fff"; ctx.fillText(place, 14, 22);
  const obj = objectiveList();
  if (obj.length && !S.inShowdown && !CUT) {
    const t = "🎯 " + obj[0] + (obj.length > 1 ? "  (외 " + (obj.length - 1) + "개)" : "");
    ctx.font = "13px " + FONT;
    R("rgba(0,0,0,0.6)", 6, 30, ctx.measureText(t).width + 16, 21);
    ctx.fillStyle = "#ffd76b"; ctx.fillText(t, 14, 45);
  }
  if (S.inShowdown) {
    ctx.font = "20px " + FONT; ctx.fillStyle = "#ff5c7a";
    ctx.fillText("❤".repeat(S.hearts) + "♡".repeat(5 - S.hearts), 500, 26);
  }

  // 화면 어둡게 (대화창은 그 위에 보여요)
  if (fadeAlpha > 0) R("rgba(0,0,0," + fadeAlpha + ")", 0, 0, 640, 416);

  // 창들
  if (MSG) drawMessage(MSG.name, MSG.text, MSG.shown);
  if (CHOICE) {
    drawMessage(null, CHOICE.question, 999);
    ctx.font = "16px " + FONT;
    const w = Math.max(...CHOICE.options.map(o => ctx.measureText(o).width)) + 50;
    const h = CHOICE.options.length * 30 + 14;
    box(626 - w, 296 - h, w, h);
    CHOICE.options.forEach((o, i) => {
      ctx.fillStyle = i === CHOICE.idx ? "#ffd76b" : "#fff";
      ctx.fillText((i === CHOICE.idx ? "▶ " : "   ") + o, 640 - w, 296 - h + 30 + i * 30);
    });
  }
  if (NOTE) drawNote();
  drawCard();
}

function drawFade() {
  if (fadeAlpha > 0) R("rgba(0,0,0," + fadeAlpha + ")", 0, 0, 640, 416);
}
function drawCard() {
  if (CARD) {
    R("#000", 0, 0, 640, 416); ctx.textAlign = "center";
    ctx.font = "bold 30px " + FONT; ctx.fillStyle = "#ffd76b"; ctx.fillText(CARD.title, 320, 190);
    ctx.font = "20px " + FONT; ctx.fillStyle = "#fff"; ctx.fillText(CARD.sub, 320, 232);
    ctx.textAlign = "left";
  }
}


// ----- 19. 시작! (1초에 60번 업데이트하고 그리기) -----
function loop() {
  update();
  draw();
  pressed.clear();
  requestAnimationFrame(loop);
}
loop();
</script>
